<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fizika 9-sinf: 3-chorak testi</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667085;--pr:#3558e6;--ok:#1a9a5b;--no:#d9423a;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#9aa3b5;--pr:#6f8cff;--ok:#3ac47d;--no:#f06a62;--bd:#313849}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
.w{max-width:560px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:22px;margin:0 0 6px}
p{color:var(--mu);margin:0 0 16px}
label{display:block;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer}
.b{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--pr);color:#fff;font-weight:600;font-size:16px}
.b:disabled{opacity:.4;cursor:not-allowed}
.o{display:block;width:100%;text-align:left;margin-top:10px;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.o.s{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 15%,transparent)}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.t{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.q{font-size:18px;font-weight:600}
.sc{font-size:44px;font-weight:700;text-align:center;margin:8px 0}
.r{border-top:1px solid var(--bd);padding:10px 0;font-size:14px}
.ok{color:var(--ok)}.no{color:var(--no)}
.hide{display:none}
</style>
</head>
<body>
<div class="w">

<a href="index.html" style="display:inline-block;margin:0 0 12px;color:var(--pr);text-decoration:none;font-weight:600">← Mundarija</a>

<div class="c" id="s1">
<h1>💧 Fizika: 3-chorak testi</h1>
<p>9-sinf • Suyuqlik va qattiq jismlar, bug’lanish, namlik, yorug’likning qaytishi va sinishi • 20 ta savol</p>
<label for="ism">Ism</label><input id="ism" autocomplete="given-name" placeholder="Ismingiz">
<label for="fam">Familiya</label><input id="fam" autocomplete="family-name" placeholder="Familiyangiz">
<button class="b" id="go" disabled>Testni boshlash</button>
</div>

<div class="c hide" id="s2">
<div class="t"><span id="nm"></span><span id="cnt"></span></div>
<div class="bar"><i id="pg"></i></div>
<div class="q" id="qt"></div>
<div id="op"></div>
<button class="b" id="nx" disabled>Keyingisi</button>
</div>

<div class="c hide" id="s3">
<h1 id="rn"></h1>
<div class="sc" id="rs"></div>
<p id="rl" style="text-align:center"></p>
<div id="rv"></div>
<button class="b" id="again">Qayta boshlash</button>
</div>

</div>
<script>
const Q=[
["Suyuqlik molekulalari qanday harakatlanadi?",["Butunlay harakatsiz turadi","Muvozanat vaziyati atrofida tebranib, vaqti-vaqti bilan joyini almashtiradi","Hamma yo’nalishda erkin, to’qnashmasdan uchadi","Faqat to’g’ri chiziq bo’ylab tekis harakatlanadi"],1],
["Sirt taranglik kuchi qanday yo’nalgan?",["Suyuqlik sirtiga urinma bo’ylab, sirtni qisqartirishga intiladi","Suyuqlik sirtiga tik, yuqoriga","Suyuqlik ichiga, chuqurlikka qarab","Idish tubiga parallel, tashqariga"],0],
["Sirt taranglik koeffitsiyentining SI dagi birligi qaysi?",["N·m","N/m","J/kg","Pa·s"],1],
["Suyuqlik qattiq jismni qachon ho’llaydi?",["Suyuqlik molekulalarining qattiq jism molekulalariga tortilishi suyuqlik molekulalarining o’zaro tortilishidan kuchli bo’lganda","Suyuqlik molekulalarining o’zaro tortilishi kuchliroq bo’lganda","Suyuqlik temperaturasi 0 °C bo’lganda","Qattiq jism massasi katta bo’lganda"],0],
["Kapillyar hodisa nima?",["Suyuqlikning qaynashi","Ingichka naychalarda suyuqlik sathining ko’tarilishi yoki pasayishi","Bug’ning suyuqlikka aylanishi","Qattiq jismning erishi"],1],
["Kapillyar naychaning diametri kamaysa, ho’llovchi suyuqlikning ko’tarilish balandligi qanday o’zgaradi?",["Kamayadi","O’zgarmaydi","Ortadi","Nolga teng bo’ladi"],2],
["Kristall jismlarning amorf jismlardan farqi nimada?",["Ularning aniq erish temperaturasi bo’ladi","Ular suyuq bo’ladi","Ularning zichligi bo’lmaydi","Ular hech qachon erimaydi"],0],
["Quyidagilardan qaysi biri amorf jism?",["Osh tuzi","Olmos","Shisha","Muz"],2],
["Monokristallning xossalari yo’nalishga qarab turlicha bo’lishi nima deyiladi?",["Izotropiya","Anizotropiya","Deformatsiya","Kondensatsiya"],1],
["Elastik deformatsiyada Guk qonuni qaysi javobda to’g’ri yozilgan?",["F = k·Δl","F = m·g","F = p·S","F = k/Δl"],0],
["Mexanik kuchlanish qaysi formula bilan topiladi?",["σ = F·S","σ = S/F","σ = F/S","σ = F·Δl"],2],
["Kristall jism erish jarayonida uning temperaturasi qanday bo’ladi?",["Doimo ortib boradi","O’zgarmas qoladi","Doimo kamayadi","Avval kamayib, keyin ortadi"],1],
["Yorug’likning sinish qonuni qaysi javobda to’g’ri yozilgan?",["sin α / sin β = n","α = β","sin α · sin β = n","tg α = n"],0],
["Solishtirma erish issiqligi λ = 3·10⁵ J/kg bo’lgan 2 kg modda to’la erishi uchun qancha issiqlik kerak? (Erish temperaturasida)",["1,5·10⁵ J","3·10⁵ J","6·10⁵ J","6·10⁶ J"],2],
["Issiqlik mashinalarining tabiatga asosiy zararli ta’siri qaysi javobda to’g’ri keltirilgan?",["Atmosferaga zararli gazlar va issiqlik chiqarib, havoni ifloslantiradi","Yer tortishish kuchini kamaytiradi","Quyosh nurini ko’paytiradi","Okeanlarni muzlatadi"],0],
["Kondensatsiya nima?",["Suyuqlikning bug’ga aylanishi","Bug’ning suyuqlikka aylanishi","Qattiq jismning erishi","Suyuqlikning qotishi"],1],
["Havoning nisbiy namligi qanday topiladi?",["Havodagi bug’ zichligining shu temperaturadagi to’yingan bug’ zichligiga nisbati, foizda","Havo massasining bug’ massasiga nisbati","To’yingan bug’ zichligining havo zichligiga ko’paytmasi","Havo bosimining atmosfera bosimiga ayirmasi"],0],
["Shudring nuqtasi nima?",["Suv qaynaydigan temperatura","Havodagi bug’ to’yingan holatga keladigan temperatura","Muz eriy boshlaydigan temperatura","Havoning eng yuqori temperaturasi"],1],
["Yorug’likning vakuumdagi tezligi taxminan qancha?",["3·10⁵ m/s","3·10⁶ m/s","3·10⁸ m/s","3·10¹⁰ m/s"],2],
["Yorug’likning qaytish qonuniga ko’ra...",["Tushish burchagi qaytish burchagiga teng","Tushish burchagi qaytish burchagidan ikki marta katta","Qaytish burchagi doimo 90° bo’ladi","Tushish burchagi sinish burchagiga teng"],0]
];
const $=i=>document.getElementById(i);
let L,i,A,name;
const sh=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function chk(){$("go").disabled=!($("ism").value.trim()&&$("fam").value.trim())}
$("ism").oninput=$("fam").oninput=chk;
$("go").onclick=()=>{name=$("ism").value.trim()+" "+$("fam").value.trim();
 L=sh(Q).map(q=>{const o=q[1].map((t,k)=>({t,c:k===q[2]}));return{q:q[0],o:sh(o)}});
 i=0;A=[];$("nm").textContent=name;$("s1").classList.add("hide");$("s2").classList.remove("hide");show()};
function show(){const x=L[i];$("cnt").textContent=(i+1)+" / 20";$("pg").style.width=(i/20*100)+"%";
 $("qt").textContent=x.q;$("nx").disabled=true;$("nx").textContent=i===19?"Yakunlash":"Keyingisi";
 const box=$("op");box.innerHTML="";
 x.o.forEach((o,k)=>{const b=document.createElement("button");b.className="o";b.textContent=String.fromCharCode(65+k)+") "+o.t;
  b.onclick=()=>{[...box.children].forEach(c=>c.classList.remove("s"));b.classList.add("s");A[i]=k;$("nx").disabled=false};
  box.appendChild(b)})}
$("nx").onclick=()=>{if(i<19){i++;show()}else end()};
function end(){let n=0,h="";
 L.forEach((x,k)=>{const ok=x.o[A[k]].c;if(ok)n++;
  if(!ok){const r=x.o.find(o=>o.c).t;h+='<div class="r"><b>'+(k+1)+'. '+x.q+'</b><br><span class="no">Sizning javobingiz: '+x.o[A[k]].t+'</span><br><span class="ok">To’g’ri javob: '+r+'</span></div>'}});
 $("rn").textContent=name;$("rs").textContent=n+" / 20";
 const p=n*5;$("rl").textContent="Natija: "+p+"% — "+(p>=85?"a’lo":p>=70?"yaxshi":p>=50?"qoniqarli":"takrorlash kerak");
 $("rv").innerHTML=h?'<p style="margin-top:14px"><b>Xato javoblar:</b></p>'+h:'<p style="margin-top:14px" class="ok">Barcha javoblar to’g’ri! 🎉</p>';
 $("s2").classList.add("hide");$("s3").classList.remove("hide")}
$("again").onclick=()=>{$("s3").classList.add("hide");$("s1").classList.remove("hide");$("ism").value=$("fam").value="";chk()};
</script>
</body>
</html>
